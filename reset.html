<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<section class="section auth-section">
  <div class="container auth-shell">
    <div class="auth-aside">
      <span class="eyebrow" data-en="Account recovery" data-ml="അക്കൗണ്ട് വീണ്ടെടുക്കൽ">Account recovery</span>
      <h1 data-en="Reset your password" data-ml="പാസ്‌വേഡ് പുനഃസജ്ജീകരിക്കുക">Reset your password</h1>
      <p data-en="Enter the email used for your school account. We will email you a 6-digit code — there is no link to click." data-ml="സ്കൂൾ അക്കൗണ്ടിന്റെ ഇമെയിൽ നൽകുക. 6 അക്ക കോഡ് ഇമെയിലായി അയക്കും — ലിങ്ക് ക്ലിക്ക് ചെയ്യേണ്ടതില്ല.">We will email you a 6-digit code — there is no link to click.</p>
      <p class="small" data-en="If you no longer have access to that email, contact the school office on 9446553567." data-ml="ആ ഇമെയിൽ ഇല്ലെങ്കിൽ 9446553567 ൽ ഓഫീസിനെ ബന്ധപ്പെടുക.">If you lost access to that email, call the office on 9446553567.</p>
    </div>

    <div class="card auth-card">
      <div id="request-form-wrap">
        <h2 data-en="Get a reset code" data-ml="റീസെറ്റ് കോഡ് നേടുക">Get a reset code</h2>
        <form id="request-form" novalidate>
          <div class="form-field"><label for="reset-email" data-en="Email address" data-ml="ഇമെയിൽ">Email address</label><input id="reset-email" type="email" autocomplete="username" required></div>
          <div class="form-msg" id="reset-msg" role="alert"></div>
          <button class="btn btn-primary" type="submit" data-en="Email me a code" data-ml="കോഡ് ഇമെയിൽ ചെയ്യുക">Email me a code</button>
        </form>
      </div>
      <form id="update-form" hidden>
        <h2 data-en="Enter the code and choose a new password" data-ml="കോഡ് നൽകി പുതിയ പാസ്‌വേഡ് തിരഞ്ഞെടുക്കുക">Enter the code and choose a new password</h2>
        <p class="small" id="otp-sent-to"></p>
        <div class="form-field" id="code-field"><label for="reset-code" data-en="6-digit code from the email" data-ml="ഇമെയിലിലെ 6 അക്ക കോഡ്">6-digit code from the email</label>
          <input id="reset-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div>
        <div class="form-field"><label for="new-password" data-en="New password" data-ml="പുതിയ പാസ്‌വേഡ്">New password</label>
          <div class="pw-wrap"><input id="new-password" type="password" autocomplete="new-password" required>
          <button class="pw-toggle" type="button" data-target="new-password">SHOW</button></div></div>
        <div class="form-field"><label for="new-password2" data-en="Confirm new password" data-ml="പാസ്‌വേഡ് വീണ്ടും">Confirm new password</label><input id="new-password2" type="password" autocomplete="new-password" required></div>
        <div class="form-msg" id="update-msg" role="alert"></div>
        <button class="btn btn-primary" type="submit" data-en="Verify code and update password" data-ml="കോഡ് പരിശോധിച്ച് പാസ്‌വേഡ് അപ്‌ഡേറ്റ് ചെയ്യുക">Verify code and update password</button>
        <p class="small" id="restart-line" hidden><a href="reset.html" data-en="Did not get the email? Start again" data-ml="ഇമെയിൽ കിട്ടിയില്ലേ? വീണ്ടും തുടങ്ങുക">Did not get the email? Start again</a></p>
      </form>
      <div class="auth-links"><a href="login.html" data-en="Back to sign in" data-ml="പ്രവേശന പേജിലേക്ക്">Back to sign in</a></div>
    </div>
  </div>
</section>
