<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class group chat | G H S S Pandi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7d1024">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="main">

<section class="section" style="padding-bottom:1rem">
  <div class="container">
    <div class="flex between wrap">
      <div>
        <span class="eyebrow" data-en="Class group chat" data-ml="ക്ലാസ് ഗ്രൂപ്പ് ചാറ്റ്">Class group chat</span>
        <h1 data-en="Your class chat" data-ml="നിങ്ങളുടെ ക്ലാസ് ചാറ്റ്">Your class chat</h1>
        <p class="muted mb-0" data-en="Only students of the class and its assigned teachers can read this room." data-ml="ഈ ക്ലാസിലെ വിദ്യാർത്ഥികൾക്കും ക്ലാസ് അധ്യാപകർക്കും മാത്രം.">Only students of the class and its assigned teachers can read this room.</p>
      </div>
      <a class="btn btn-ghost btn-sm" href="dashboard.html" data-en="Back to dashboard" data-ml="ഡാഷ്ബോർഡിലേക്ക്">Back to dashboard</a>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="chat-shell">
      <aside class="chat-rooms" id="chat-rooms" aria-label="Class rooms"></aside>
      <div class="chat-main">
        <div class="chat-head">
          <div>
            <h3 id="chat-room-title" data-en="Loading…" data-ml="ലോഡ് ചെയ്യുന്നു…">Loading…</h3>
            <span class="small muted" id="chat-room-sub"></span>
          </div>
          <span class="tag green" data-en="Teacher moderated" data-ml="അധ്യാപക നിയന്ത്രണം">Teacher moderated</span>
        </div>
        <div class="chat-feed" id="chat-feed" aria-live="polite">
          <div class="skeleton" style="height:60px"></div>
          <div class="skeleton" style="height:60px"></div>
        </div>
        <form class="chat-composer" id="chat-form" novalidate>
          <label class="sr-only" for="chat-input">Message</label>
          <input id="chat-input" type="text" maxlength="500" autocomplete="off"
                 data-en-ph="Write a message…" data-ml-ph="സന്ദേശം എഴുതുക…" placeholder="Write a message…">
          <span class="chat-count" id="chat-count">0/500</span>
          <button class="btn btn-primary" type="submit" data-en="Send" data-ml="അയക്കുക">Send</button>
        </form>
        <div class="form-msg" id="chat-msg" role="alert"></div>
        <p class="small muted chat-note" data-en="Messages are moderated by teachers. Abusive content is removed and recorded." data-ml="അധ്യാപകർ സന്ദേശങ്ങൾ നിയന്ത്രിക്കുന്നു. അനുചിതമായ ഉള്ളടക്കം നീക്കം ചെയ്യും.">Messages are moderated by teachers. Abusive content is removed and recorded.</p>
      </div>
    </div>
  </div>
</section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/lang-kn.js"></script>
    <script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/backend-demo.js"></script>
<script src="js/backend-supabase.js"></script>
<script src="js/api.js"></script>
<script src="js/site.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/chat.js"></script>
</body>
</html>
